name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: '**/go.sum'
      - name: Check formatting and every module
        run: |
          test -z "$(gofmt -l .)"
          make modules-check
          make tidy
          git diff --exit-code -- go.mod driver/mail/go.mod driver/mail/go.sum examples/mail/go.mod examples/mail/go.sum integration/go.mod integration/go.sum docs/go.mod
      - name: Test all libraries and executable examples
        run: |
          make test
          make vet
          make test-race
      - name: Verify generated documentation
        run: |
          make check-generated
          git diff --exit-code -- README.md docs/advanced.md docs/assets/badges
      - name: Upload library unit coverage when Codecov is configured
        if: vars.CODECOV_ENABLED == 'true' && matrix.go == 'stable'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          files: .artifacts/unit-coverage.out
          flags: unit
          disable_search: true
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: '**/go.sum'
      - name: Verify pinned native servers
        run: make test-integration
